name: Automatic Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag override (e.g. v0.1.38)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Extract package version
        id: version
        shell: pwsh
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $tagInput = "${{ github.event.inputs.tag }}"
          if ($tagInput -ne "") {
            $tag = $tagInput
          } elseif ($env:GITHUB_REF.StartsWith("refs/tags/v")) {
            $tag = $env:GITHUB_REF.Substring(10)
          } else {
            $tag = "v$($pkg.version)"
          }
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "version=$($pkg.version)" >> $env:GITHUB_OUTPUT
          Write-Host "Resolved release tag: $tag (version $($pkg.version))"

      - name: Build Web Bundle and Electron Installer
        run: npm run electron:build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Bobby ${{ steps.version.outputs.tag }}
          files: |
            dist_electron/Bobby-Setup-*.exe
            dist_electron/latest.yml
            dist_electron/*.blockmap
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
