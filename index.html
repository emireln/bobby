<!doctype html>
<!--
  `lang` is updated at startup by src/i18n based on the user's language setting.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>bobby - SVG animated bot avatar & timeline studio</title>
    <meta
      name="description"
      content="bobby is a pure SVG animated bot avatar engine with 16 customizable shapes, 24 expressions, 18 animation states, speech bubbles, and a timeline sequencer studio."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="bobby - SVG animated bot avatar & timeline studio" />
    <meta
      property="og:description"
      content="Pure SVG animated bot avatar engine with 16 customizable shapes, 24 expressions, 18 animation states, and timeline sequencer studio."
    />
    <meta property="og:site_name" content="bobby" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="pt_BR" />

    <meta name="twitter:card" content="summary_large_image" />

    <link rel="canonical" href="https://bobby.vercel.app/" />
    <meta property="og:url" content="https://bobby.vercel.app/" />
    <meta property="og:image" content="https://bobby.vercel.app/banner.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Bobby vector animated bot avatar banner"
    />

    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <meta name="theme-color" content="#f9f9f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0c" media="(prefers-color-scheme: dark)" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
